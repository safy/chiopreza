<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слёт партнёров Чио Чио · 13.11.2026</title>
<style>
@font-face{font-family:'Cera Pro';src:url(fonts/CeraPro-Regular.ttf) format('truetype');font-weight:400}
@font-face{font-family:'Cera Pro';src:url(fonts/CeraPro-Medium.ttf) format('truetype');font-weight:500}
@font-face{font-family:'Cera Pro';src:url(fonts/CeraPro-Bold.ttf) format('truetype');font-weight:700}
@font-face{font-family:'Cera Pro';src:url(fonts/CeraPro-Black.ttf) format('truetype');font-weight:900}
:root{--navy:#0d263f;--red:#e50040;--light:#e5e6e0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Cera Pro',sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--navy)}
.slide{position:absolute;inset:0;visibility:hidden}
.slide.on{visibility:visible;z-index:2}
.slide.leaving{visibility:visible;z-index:1}
.slide svg.art{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}

.ov{position:absolute;pointer-events:none}
.cnt{font-family:'Cera Pro';white-space:nowrap}
#hud{position:fixed;right:18px;bottom:14px;color:#fff8;font:500 13px 'Cera Pro',sans-serif;opacity:0;transition:opacity .3s;z-index:10}
body:hover #hud{opacity:1}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--red);z-index:10;transition:width .5s}
</style>
</head>
<body>
<div id="stage">
<!--SLIDES-->
</div>
<div id="progress"></div>
<div id="hud">← → пробел — листать · F — полный экран · R — повторить анимацию</div>
<script src="lib/gsap.min.js"></script>
<script src="lib/deck.js"></script>
</body>
</html>
